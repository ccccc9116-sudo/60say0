<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172554">
  <title>띵타이쿤 스마트 세공 계산기</title>
  <style>
    :root { color-scheme: light; --navy:#172554; --blue:#2563eb; --line:#dbe2ea; --muted:#64748b; --bg:#f3f6fb; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:#172033; font-family:system-ui,-apple-system,"Malgun Gothic","맑은 고딕",sans-serif; }
    .wrap { max-width:760px; margin:0 auto; padding:24px 16px 40px; }
    header { background:linear-gradient(135deg,#172554,#334e8a); color:#fff; padding:25px 24px; border-radius:20px; box-shadow:0 8px 24px #17255420; }
    header .gem { font-size:34px; }
    h1 { margin:7px 0 5px; font-size:clamp(22px,4vw,30px); }
    header p { margin:0; color:#dbeafe; font-size:14px; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px; margin-top:16px; box-shadow:0 3px 12px #0f172a08; }
    h2 { margin:0 0 16px; font-size:17px; }
    .subhead { font-size:13px; color:var(--muted); margin:18px 0 10px; font-weight:700; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .field { display:flex; flex-direction:column; gap:7px; min-width:0; }
    label { font-size:13px; font-weight:650; color:#334155; }
    input,select { width:100%; min-width:0; padding:11px 10px; border:1px solid #cbd5e1; border-radius:9px; font:inherit; background:white; color:#172033; }
    input:focus,select:focus { outline:3px solid #bfdbfe; border-color:#3b82f6; }
    .divider { border:0; border-top:1px solid #e2e8f0; margin:20px 0; }
    .actions { display:flex; gap:10px; margin-top:18px; }
    button { border:0; border-radius:10px; padding:13px 16px; font:inherit; font-weight:750; cursor:pointer; }
    .primary { flex:1; background:var(--navy); color:#fff; }
    .primary:hover { background:#243b72; }
    .secondary { background:#e2e8f0; color:#334155; }
    .result { white-space:pre-wrap; overflow-wrap:anywhere; font:14px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace; background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:16px; min-height:80px; }
    .result.empty { color:#94a3b8; font-family:inherit; }
    .status { margin-top:12px; padding:12px 14px; border-radius:10px; font-size:13px; font-weight:700; }
    .status.ok { color:#166534; background:#dcfce7; }
    .status.warn { color:#92400e; background:#fef3c7; }
    .notice { margin:12px 2px 0; color:var(--muted); font-size:12px; line-height:1.6; }
    footer { text-align:center; color:#94a3b8; font-size:12px; margin-top:22px; }
    @media (max-width:560px) {
      .wrap { padding:12px 10px 28px; }
      header { padding:21px 18px; border-radius:15px; }
      .panel { padding:16px 14px; }
      .grid { grid-template-columns:1fr; gap:11px; }
      .actions { flex-direction:column; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="gem" aria-hidden="true">💎</div>
      <h1>띵타이쿤 스마트 세공 계산기</h1>
      <p>보유 재고와 초기 수치를 입력해 세공 횟수와 남은 재고를 계산하세요.</p>
    </header>

    <form id="calculator">
      <section class="panel">
        <h2>① 현재 남은 재고</h2>
        <div class="grid">
          <div class="field"><label for="vStock">바이올렛 남은 수량</label><input id="vStock" type="number" min="0" step="1" value="10" required></div>
          <div class="field"><label for="oStock">오팔 남은 수량</label><input id="oStock" type="number" min="0" step="1" value="10" required></div>
          <div class="field"><label for="aStock">아다만티움 남은 수량</label><input id="aStock" type="number" min="0" step="1" value="10" required></div>
        </div>
        <hr class="divider">
        <h2>② 세공 대상 보석 정보</h2>
        <div class="field">
          <label for="tier">태생 등급</label>
          <select id="tier">
            <option value="커먼">커먼 (상한선 200점)</option>
            <option value="노멀" selected>노멀 (상한선 212점)</option>
            <option value="레어">레어 (상한선 236점)</option>
          </select>
        </div>
        <div class="subhead">초기 수치</div>
        <div class="grid">
          <div class="field"><label for="vVal">바이올렛 · 순도</label><input id="vVal" type="number" min="0" max="100" step="1" placeholder="예: 40" required></div>
          <div class="field"><label for="oVal">오팔 · 광도</label><input id="oVal" type="number" min="0" max="100" step="1" placeholder="예: 50" required></div>
          <div class="field"><label for="aVal">아다만티움 · 강도</label><input id="aVal" type="number" min="0" max="100" step="1" placeholder="예: 30" required></div>
        </div>
        <div class="actions">
          <button class="primary" type="submit">최적 세공 계산하기</button>
          <button class="secondary" type="button" id="reset">초기화</button>
        </div>
        <p class="notice">계산 후에는 남은 재고가 자동으로 다음 계산에 이월됩니다. 초기 수치 입력칸은 계산 후 비워집니다.</p>
      </section>
    </form>

    <section class="panel" aria-live="polite">
      <h2>③ 최적 세공 결과</h2>
      <div id="result" class="result empty">초기 순도, 광도, 강도를 입력한 뒤 계산하기를 눌러주세요.</div>
      <div id="status" hidden></div>
    </section>
    <footer>띵타이쿤 스마트 세공 계산기 · GitHub Pages용 웹 버전</footer>
  </main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const limits = { "커먼": 200, "노멀": 212, "레어": 236 };
  const form = $("calculator");
  const result = $("result");
  const status = $("status");

  function readInt(id, label) {
    const raw = $(id).value.trim();
    if (raw === "") throw new Error(`${label} 값을 입력해주세요.`);
    const n = Number(raw);
    if (!Number.isSafeInteger(n)) throw new Error(`${label}은(는) 정수로 입력해주세요.`);
    if (n < 0) throw new Error(`${label}은(는) 0 이상이어야 합니다.`);
    return n;
  }

  form.addEventListener("submit", event => {
    event.preventDefault();
    try {
      const vStock = readInt("vStock", "바이올렛 재고");
      const oStock = readInt("oStock", "오팔 재고");
      const aStock = readInt("aStock", "아다만티움 재고");
      const tier = $("tier").value;
      const maxLimit = limits[tier];
      const vVal = readInt("vVal", "초기 순도");
      const oVal = readInt("oVal", "초기 광도");
      const aVal = readInt("aVal", "초기 강도");
      if ([vVal,oVal,aVal].some(n => n > 100)) throw new Error("초기 순도·광도·강도는 각각 100 이하여야 합니다.");

      const currentSum = vVal + oVal + aVal;
      const neededPoints = maxLimit - currentSum;
      const maxPossibleTotalCount = Math.max(0, Math.floor(neededPoints / 10));
      const totalStock = vStock + oStock + aStock;
      const totalNeededCount = Math.min(maxPossibleTotalCount, totalStock);
      const targetRemAvg = Math.round((totalStock - totalNeededCount) / 3);

      function getCount(stock, currentValue) {
        const idealUse = stock - targetRemAvg;
        const maxPossibleByValue = Math.floor((100 - currentValue) / 10);
        return Math.max(0, Math.min(stock, idealUse, maxPossibleByValue));
      }

      const stocks = [
        { stock:vStock, value:vVal, count:getCount(vStock,vVal), name:"바이올렛 (순도)", key:"v" },
        { stock:oStock, value:oVal, count:getCount(oStock,oVal), name:"오팔 (광도)", key:"o" },
        { stock:aStock, value:aVal, count:getCount(aStock,aVal), name:"아다만티움 (강도)", key:"a" }
      ];
      let assignedTotal = stocks.reduce((sum,s) => sum + s.count, 0);

      while (assignedTotal > totalNeededCount) {
        stocks.sort((x,y) => y.stock - x.stock);
        let reduced = false;
        for (const s of stocks) {
          if (s.count > 0) {
            s.count--;
            assignedTotal--;
            reduced = true;
            break;
          }
        }
        if (!reduced) break;
      }

      let diff = totalNeededCount - assignedTotal;
      while (diff > 0) {
        stocks.sort((x,y) => y.stock - x.stock);
        let adjusted = false;
        for (const s of stocks) {
          if (diff > 0 &&
              s.count < s.stock &&
              (s.value + (s.count + 1) * 10) <= 100 &&
              (currentSum + (assignedTotal + 1) * 10) <= maxLimit) {
            s.count++;
            diff--;
            assignedTotal++;
            adjusted = true;
          }
        }
        if (!adjusted) break;
      }

      const vCount = stocks.find(s => s.key === "v").count;
      const oCount = stocks.find(s => s.key === "o").count;
      const aCount = stocks.find(s => s.key === "a").count;
      const vFinal = vVal + vCount * 10;
      const oFinal = oVal + oCount * 10;
      const aFinal = aVal + aCount * 10;
      const finalSum = vFinal + oFinal + aFinal;
      const vRem = vStock - vCount;
      const oRem = oStock - oCount;
      const aRem = aStock - aCount;

      const lines = [
        `• 목표 등급 상한선 : ${maxLimit}점`,
        `• 최종 세공 총점   : ${finalSum}점`,
        "---------------------------------------",
        ` [순도] 바이올렛 : ${vVal} -> ${vFinal} (+${vCount}회)`,
        ` [광도] 오팔     : ${oVal} -> ${oFinal} (+${oCount}회)`,
        ` [강도] 아다만티움 : ${aVal} -> ${aFinal} (+${aCount}회)`,
        "---------------------------------------",
        ` [남은 재고] 바이올렛: ${vRem} / 오팔: ${oRem} / 아다만티움: ${aRem}`
      ];
      const ok = finalSum <= maxLimit && vFinal <= 100 && oFinal <= 100 && aFinal <= 100;
      lines.push(ok ? " 상태: [정상] 상한선 이내 안전 & 조건 완벽 충족!" : " 상태: [경고] 개별 100 제한 초과 확인 필요!");

      result.textContent = lines.join("\n");
      result.classList.remove("empty");
      status.hidden = false;
      status.className = "status " + (ok ? "ok" : "warn");
      status.textContent = ok ? "정상: 등급 상한선과 개별 100점 제한 이내입니다." : "경고: 계산 결과가 제한을 초과했는지 확인해주세요.";

      // 자동 재고 이월
      $("vStock").value = vRem;
      $("oStock").value = oRem;
      $("aStock").value = aRem;
      $("vVal").value = "";
      $("oVal").value = "";
      $("aVal").value = "";
    } catch (err) {
      alert(err.message || "입력값을 확인해주세요.");
    }
  });

  $("reset").addEventListener("click", () => {
    $("vStock").value = 10;
    $("oStock").value = 10;
    $("aStock").value = 10;
    $("tier").value = "노멀";
    $("vVal").value = "";
    $("oVal").value = "";
    $("aVal").value = "";
    result.textContent = "초기 순도, 광도, 강도를 입력한 뒤 계산하기를 눌러주세요.";
    result.classList.add("empty");
    status.hidden = true;
  });
})();
</script>
</body>
</html>
